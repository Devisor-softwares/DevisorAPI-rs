version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: game-panel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: game_panel
      POSTGRES_USER: panel_user
      POSTGRES_PASSWORD: panel_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel_user -d game_panel"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - game-panel-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: game-panel-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - game-panel-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  game-panel-network:
    driver: bridge
